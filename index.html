<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Traza · cuaderno de esquí</title>
<meta name="description" content="Tu historial de esquí en un globo 3D: estaciones, bajadas, repeticiones y estadísticas a partir de tus ficheros .slopes.">
<meta name="theme-color" content="#0F2740">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="map" aria-label="Mapa"></div>

<div id="hud" hidden>
  <span id="hud-time">--:--</span>
  <span id="hud-speed"><b>0</b> km/h</span>
  <span id="hud-alt"><b>0</b> m</span>
</div>

<div id="mapctl">
  <div class="seg" role="group" aria-label="Fondo del mapa">
    <button data-base="nieve" class="on">Nieve</button>
    <button data-base="sat">Satélite</button>
    <button data-base="topo">Topo</button>
  </div>
  <button id="btn-pistes" class="chip on" aria-pressed="true" title="Mostrar pistas de OpenSnowMap">Pistas</button>
</div>

<main id="panel">
  <nav id="tabs">
    <a class="brand" href="#/" aria-label="Inicio">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path d="M2 27 12 8l5 8 3-4 10 15z" fill="#0F2740"/><path d="M12 8c3 5-3 7 1 11s-2 5 0 8" fill="none" stroke="#D7263D" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span>Traza</span>
    </a>
    <a href="#/" data-tab="home">Globo</a>
    <a href="#/stats" data-tab="stats">Estadísticas</a>
    <a href="#/add" data-tab="add">Añadir días</a>
  </nav>
  <div id="body" tabindex="-1"></div>
</main>

<div id="drop" hidden><div>Suelta los ficheros .slopes</div></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<input id="file" type="file" multiple accept=".slopes,.zip,application/zip" hidden>

<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/fflate.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
